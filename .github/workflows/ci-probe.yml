# CI 探针：验证 macOS runner 上的工具链与构建机制（无密钥、无版权文件）
#
# 本工作流是 T05 的实跑验证。它只动公开物料（fork 源码、公开 NuGet、Godot 官方发行物、
# runner 自带 Xcode），不触碰游戏 pck / sts2.dll 真品 / FMOD / Spine，因此可在公开仓库
# 的免费 macOS runner 上安全运行。
#
# 验证项（每项带耗时记录，结果写入 GITHUB_STEP_SUMMARY）：
#   A. runner 环境：macOS 版本、架构、Xcode 版本、iOS SDK
#   B. .NET 9 SDK 安装 + 织入器编译（仓库公开代码；补丁库依赖 game-refs/ 私有物料，不在此验证）
#   C. 桩程序集 NativeAOT ios-arm64 publish → sts2.dylib（全链路最难一步，用空壳 dll 代替真品）
#   D. Godot 4.5.1 mono + mono 版 iOS 导出模板的获取与 headless 运行
#   E. 最小 Godot 工程 headless iOS 导出（Godot → Xcode → ipa 机制）
#   F. iOS 原生交叉编译 + ad-hoc codesign + Payload 打包成 ipa（无账号签名机制）

name: CI 探针（T05）

on:
  push:
    paths:
      - .github/workflows/ci-probe.yml
      - src/**
      - ios-export/**
      - tools/**
      - .github/workflows/ci-probe.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 记录开始时间
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      # ── A. runner 环境快照 ──────────────────────────────────────────
      - name: A · runner 环境快照
        run: |
          {
            echo '## A · runner 环境快照'
            echo
            echo '| 项 | 值 |'
            echo '|---|---|'
            echo "| macOS | $(sw_vers -productVersion) |"
            echo "| 架构 | $(uname -m) |"
            echo "| runner | ${{ runner.name }} / ${{ runner.os }} |"
            echo "| xcode-select | $(xcode-select -p) |"
            echo "| Xcode | $(xcodebuild -version 2>&1 | tr '\n' ' ') |"
            echo "| iOS SDK | $(xcodebuild -showsdks 2>/dev/null | grep -oE 'iphoneos[0-9.]+' | sort -u | tr '\n' ' ') |"
            echo "| 已装 Xcode | $(ls /Applications | grep -i '^Xcode' | tr '\n' ' ') |"
            echo
            echo '```'
            xcodebuild -showsdks 2>&1 | grep -E 'iOS|watchOS|tvOS|visionOS' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 同样回显到 stdout，保证 job log 里可见
          echo "===A 环境事实==="
          sw_vers
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true
          ls /Applications | grep -i '^Xcode' || true

      # ── B. .NET 9 SDK + 公开代码编译 ────────────────────────────────
      - name: B · 安装 .NET 9 SDK
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 9.0 --install-dir "$HOME/.dotnet9"
          echo "$HOME/.dotnet9" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet9" >> "$GITHUB_ENV"
          dotnet --info | head -20

      - name: B · 编译织入器（公开代码）
        run: |
          # STS2Weaver 是纯公开代码（Mono.Cecil 织入器），可也应在公开 CI 上编译验证。
          dotnet build src/STS2Weaver -c Release --nologo -v m
          test -f src/STS2Weaver/bin/Release/net9.0/STS2Weaver.dll
          # 补丁库 STS2MobileIos 不在此编译：它 <Reference> 了 ../../game-refs/ 下的
          # sts2.dll（游戏本体）与 GodotSharp.dll，属私有物料，在全链路工作流里编译。
          ls game-refs 2>/dev/null && echo "⚠️ game-refs 存在（不应出现于公开 CI）" || echo "game-refs/ 不存在（符合预期：补丁库编译属私有链路）"

      - name: B · 小结
        run: |
          {
            echo '## B · .NET 9 + 公开代码编译'
            echo
            echo '| 项 | 结果 |'
            echo '|---|---|'
            echo "| .NET SDK | $(dotnet --list-sdks | tr '\n' ' ') |"
            echo '| STS2Weaver 编译 | ✅ |'
            echo '| STS2MobileIos 编译 | ⏭️ 属私有链路（依赖 game-refs/ 的 sts2.dll + GodotSharp.dll），见全链路工作流 |'
            echo "| 耗时 | $(( $(date +%s) - T0 ))s（自任务开始累计） |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── C. 桩程序集 NativeAOT ios-arm64 ─────────────────────────────
      # 用 dotnet new classlib 生成一个空的 sts2.dll（程序集名匹配 Godot 硬耦合），
      # 放进 prebuilt/ 走完整的 dotnet publish -r ios-arm64。不含任何游戏代码，
      # 但完整验证：Godot.NET.Sdk 4.5.1 还原、ILC 交叉编译、ios-arm64 runtime pack。
      - name: C · 桩程序集 NativeAOT ios-arm64 publish
        run: |
          # 两个桩目录完全隔离（含 obj），避免 -o 共享输出时 obj 交叉引用导致重复特性编译错误
          mkdir -p /tmp/stub-patch && cd /tmp/stub-patch
          # 补丁库桩：sts2.csproj 的 <TrimmerRootAssembly Include="STS2MobileIos" />
          # 要求 ILC 输入里必须有这个程序集（真链路里它由 build-ios.sh 步骤 2 从私有物料织入）
          dotnet new classlib -n STS2MobileIos -o . --force -f net9.0
          dotnet build STS2MobileIos.csproj -c Release \
            -o "$GITHUB_WORKSPACE/ios-export/prebuilt/deps" \
            -p:BaseIntermediateOutputPath=obj-patch/ --nologo -v m
          mkdir -p /tmp/stub-main && cd /tmp/stub-main
          dotnet new classlib -n sts2 -o . --force -f net9.0
          dotnet build sts2.csproj -c Release \
            -o "$GITHUB_WORKSPACE/ios-export/prebuilt" \
            -p:BaseIntermediateOutputPath=obj-main/ --nologo -v m
          test -f "$GITHUB_WORKSPACE/ios-export/prebuilt/sts2.dll"
          test -f "$GITHUB_WORKSPACE/ios-export/prebuilt/deps/STS2MobileIos.dll"
          cd "$GITHUB_WORKSPACE/ios-export"
          TC0=$(date +%s)
          dotnet publish sts2.csproj -c ExportRelease -r ios-arm64 \
            -p:GodotTargetPlatform=ios --self-contained --nologo -v m 2>&1 | tee /tmp/publish.log
          PUBRC=${PIPESTATUS[0]}
          TC1=$(date +%s)
          DYLIB=$(find . -name 'sts2.dylib' -path '*publish*' | head -1)
          {
            echo '## C · 桩程序集 NativeAOT ios-arm64'
            echo
            echo '| 项 | 结果 |'
            echo '|---|---|'
            echo "| dotnet publish 退出码 | $PUBRC |"
            echo "| sts2.dylib | ${DYLIB:-未产出} |"
            echo '| arm64 校验 |'
            if [ -n "$DYLIB" ]; then
              echo "| file | $(file "$DYLIB" | cut -d: -f2-) |"
              echo '| ✅ ILC 在 runner 上交叉编译 ios-arm64 成功 |  |'
            else
              echo '| ❌ NativeAOT 未产出 | 看 /tmp/publish.log |'
              echo
              echo '```'
              grep -iE 'error|fatal' /tmp/publish.log | tail -30
              echo '```'
            fi
            echo "| 耗时 | $((TC1 - TC0))s |"
          } >> "$GITHUB_STEP_SUMMARY"
          # 这一步是全链路最贵的验证，失败即整个 T05 判据动摇，不放过
          [ "$PUBRC" = 0 ] || exit 1
          [ -n "$DYLIB" ] || exit 1

      # ── D. Godot 4.5.1 mono + iOS 导入模板 ──────────────────────────
      - name: D · 获取 Godot 4.5.1 mono + mono 版 iOS 导出模板
        run: |
          GD=4.5.1-stable
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/$GD/Godot_v4.5.1-stable_mono_macos.universal.zip"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/$GD/Godot_v4.5.1-stable_mono_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          # mono macos 包是 Godot_mono.app/Contents/MacOS/Godot（目录深度 3+），find 要够深
          GODOT=$(find /tmp/godot-bin -type f -name 'Godot' | head -1)
          [ -n "$GODOT" ] || GODOT=$(find /tmp/godot-bin -type f -name 'Godot*' ! -name '*.zip' ! -name '*.dll' | head -1)
          [ -n "$GODOT" ] || { echo "❌ 未在解压结果中找到 Godot 可执行文件"; ls -R /tmp/godot-bin | head -20; exit 1; }
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.5.1.stable.mono"
          mkdir -p "$TPL_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp -R /tmp/tpl/templates/* "$TPL_DIR"/
          {
            echo '## D · Godot 4.5.1 mono 获取'
            echo
            echo '| 项 | 结果 |'
            echo '|---|---|'
            echo '| Godot 可执行 | ✅ |'
            echo "| 模板目录 | $(ls "$TPL_DIR" | tr '\n' ' ') |"
            echo '| headless 自检 |'
            echo
            echo '```'
            "$GODOT" --headless --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── E. 最小工程 headless iOS 导出 ───────────────────────────────
      # 用纯 GDScript 空壳工程（无 GDExtension、无 C# 脚本）跑 Godot 的 iOS 导出。
      # 验证「Godot headless → Xcode 工程 → xcodebuild → ipa」机制本身。
      # 真实工程的 GDExtension 库（Spine/FMOD）属私有物料，不在本探针范围。
      - name: E · 最小 Godot 工程 headless iOS 导出
        run: |
          PROBE=/tmp/godot-probe
          mkdir -p "$PROBE" && cd "$PROBE"
          # 工程正文经 base64 单行写入，规避 YAML 块标量对 heredoc 缩进的限制
          # 注意 etc2_astc：Godot 源码 has_valid_project_configuration 在缺该开关时直接
          # valid=false 且不附消息（editor_export_platform_apple_embedded.cpp:2276），
          # 表现为只报「C#/.NET experimental」而掩盖真因。底座 project.godot 有此开关。
          echo '' \
            | base64 -d > project.godot
          echo 'W2dkX3NjZW5lIGxvYWRfc3RlcHM9MSBmb3JtYXQ9M10KW25vZGUgbmFtZT0iUm9vdCIgdHlwZT0iQ29udHJvbCJdCg==' \
            | base64 -d > main.tscn
          echo '' \
            | base64 -d > export_presets.cfg
          # 本轮试验：team id 填假值。真链路里这是 build-ios.sh 之外 CI 必须注入的配置点
          # （底座 preset 里 app_store_team_id 为空，靠 Xcode 侧事后改 pbxproj 兜底，
          # 但 Godot 导出本身在有 C# 的工程上是 experimental 提示 + team id 必填）
          cat export_presets.cfg | grep app_store_team_id
          TE0=$(date +%s)
          mkdir -p build
          # 生成应用图标（Godot iOS 导出的图标集全部必填，缺一个即导出失败；
          # 键名来自 Godot 源码 platform/ios/export/export_plugin.cpp 的 icon 表）
          echo '' \
            | base64 -d > /tmp/genicons.py
          python3 /tmp/genicons.py "$PROBE"
          "$GODOT" --headless --path "$PROBE" --export-release "iOS" build/CIProbe.ipa 2>&1 | tee export.log
          ERC=${PIPESTATUS[0]}
          TE1=$(date +%s)
          IPA=""; [ -f build/CIProbe.ipa ] && IPA=build/CIProbe.ipa
          XCP=$(ls -d build/*.xcodeproj 2>/dev/null | head -1)
          {
            echo '## E · 最小 Godot 工程 headless iOS 导出'
            echo
            echo '| 项 | 结果 |'
            echo '|---|---|'
            echo "| --export-release 退出码 | $ERC |"
            echo "| ipa | ${IPA:-未产出} |"
            echo "| Xcode 工程 | ${XCP:-未产出} |"
            echo "| 耗时 | $((TE1 - TE0))s |"
            echo
            echo '```'
            tail -25 export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── E2. 兜底：xcodebuild 无签名构建 + ad-hoc 签名 → ipa ──────────
      # Godot 导出在无 Apple 账号的 runner 上会停在 xcodebuild archive 的
      # 签名身份校验（免费账号无头 CI 的已知边界）。兜底路径 = T07 免费
      # 账号路线要走的同一条路：对已生成的 xcodeproj 做无签名构建，手动
      # ad-hoc 签名后按 Payload 结构打包（产物可交设备端 SideStore 重签）。
      - name: E2 · xcodebuild 无签名构建 + ad-hoc 签名打包
        run: |
          PROBE=/tmp/godot-probe
          cd "$PROBE"
          XCP=$(ls -d build/*.xcodeproj 2>/dev/null | head -1)
          [ -n "$XCP" ] || { echo "❌ 无 Xcode 工程（E 步未跑到框架拷贝阶段）"; exit 1; }
          TE2=$(date +%s)
          xcodebuild -project "$XCP" -scheme CIProbe -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DD \
            -destination generic/platform=ios build 2>&1 | tail -8
          APP=$(find build/DD -type d -name 'CIProbe.app' | grep -E 'Release-iphoneos' | head -1)
          [ -n "$APP" ] || { echo "❌ 无符号构建未产出 CIProbe.app"; find build/DD -name '*.app' | head; exit 1; }
          codesign -f -s - --generate-entitlement-der "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature' || true
          rm -rf "$PROBE/Payload"; mkdir -p "$PROBE/Payload"
          cp -R "$APP" "$PROBE/Payload/"
          zip -qr "$PROBE/build/CIProbe-adhoc.ipa" Payload
          TE3=$(date +%s)
          {
            echo '## E2 · xcodebuild 无签名构建 + ad-hoc 签名 → ipa'
            echo
            echo '| 项 | 结果 |'
            echo '|---|---|'
            echo "| Xcode 工程 | $XCP |"
            echo "| 无签名构建 app | $APP |"
            echo '| ad-hoc 签名 | ✅ |'
            echo "| CIProbe-adhoc.ipa | $(du -h "$PROBE/build/CIProbe-adhoc.ipa" | cut -f1) |"
            echo "| 耗时 | $((TE3 - TE2))s |"
            echo
            echo '```'
            unzip -l "$PROBE/build/CIProbe-adhoc.ipa" | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── F. iOS 原生交叉编译 + ad-hoc 签名 + ipa 打包 ────────────────
      # 用 clang 直编一个 iOS arm64 小程序，ad-hoc 签名后按 Payload 结构打包。
      # 这正是 SideStore/免费账号路线在无头环境下的签名机制。
      - name: F · clang 交叉编译 + ad-hoc codesign + Payload ipa
        run: |
          SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          WORK=/tmp/ipa-probe && mkdir -p "$WORK" && cd "$WORK"
          echo 'I2ltcG9ydCA8Rm91bmRhdGlvbi9Gb3VuZGF0aW9uLmg+CmludCBtYWluKGludCBhcmdjLCBjb25zdCBjaGFyICphcmd2W10pIHsKICAgIE5TTG9nKEAiY2ktcHJvYmUgYWQtaG9jIGlwYTogb2siKTsKICAgIHJldHVybiAwOwp9Cg==' \
            | base64 -d > hello.m
          clang -arch arm64 -isysroot "$SYSROOT" -framework Foundation -o hello hello.m
          file hello | grep -q arm64 || { echo "clang 未产出 arm64"; exit 1; }
          mkdir -p CIProbe.app
          cp hello CIProbe.app/
          echo '' \
            | base64 -d > CIProbe.app/Info.plist
          codesign -s - --force CIProbe.app
          codesign -dv CIProbe.app 2>&1 | grep -E 'Identifier|Format|Signature' || true
          mkdir -p Payload
          cp -R CIProbe.app Payload/
          zip -qr CIProbe.ipa Payload
          unzip -l CIProbe.ipa | head -10
          TF1=$(date +%s)
          {
            echo '## F · clang 交叉编译 + ad-hoc 签名 + ipa'
            echo
            echo '| 项 | 结果 |'
            echo '|---|---|'
            echo "| iOS SDK | $SYSROOT |"
            echo '| clang arm64 交叉编译 | ✅ |'
            echo '| ad-hoc codesign（无账号） | ✅ |'
            echo "| CIProbe.ipa | $(du -h CIProbe.ipa | cut -f1) |"
            echo "| 总耗时（全任务） | $((TF1 - T0))s |"
          } >> "$GITHUB_STEP_SUMMARY"
